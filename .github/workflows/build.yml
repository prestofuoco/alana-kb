name: Build Alana Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup QMK and Compile
        run: |
          qmk setup -y
          mkdir -p /qmk_firmware/keyboards/alana
          cp -R src/* /qmk_firmware/keyboards/alana/
          qmk compile -kb alana -km default

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alana_default_firmware
          path: /qmk_firmware/alana_default.bin
          if-no-files-found: error
